[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-results-lab07"
version = "0.7.0"
description = "SQLite persistence layer for sports results"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "SQLAlchemy>=2.0", "alembic>=1.13"]

[project.scripts]
sports-streaming = "sports_streaming.main:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = ["integration: tests using a test SQLite database"]
